<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 660 300" role="img" aria-label="修改前后对比示意">
      <text x="20" y="26" font-size="15" font-weight="600" fill="#E8ECF3">修改前 · cover 填满（裁左右）</text>
      <rect x="65" y="55" width="150" height="200" fill="#4C8DFF" fill-opacity=".35"/>
      <rect x="45" y="55" width="20" height="200" fill="#F85149" fill-opacity=".3" stroke="#F85149" stroke-dasharray="4 3"/>
      <rect x="215" y="55" width="20" height="200" fill="#F85149" fill-opacity=".3" stroke="#F85149" stroke-dasharray="4 3"/>
      <rect x="65" y="55" width="150" height="200" fill="none" stroke="#E8ECF3" stroke-width="2"/>
      <text x="55" y="160" font-size="13" fill="#F85149" text-anchor="middle" font-weight="700">裁</text>
      <text x="225" y="160" font-size="13" fill="#F85149" text-anchor="middle" font-weight="700">裁</text>
      <text x="140" y="46" font-size="11" fill="#98A2B3" text-anchor="middle">屏幕容器（全屏）</text>
      <text x="20" y="284" font-size="12.5" fill="#98A2B3">视频比容器宽 → 引擎放大铺满 → 两侧被裁</text>
      <text x="360" y="26" font-size="15" font-weight="600" fill="#E8ECF3">修改后 · 内接适配（零裁剪）</text>
      <rect x="405" y="55" width="150" height="200" fill="#0B0E13" stroke="#E8ECF3" stroke-width="2"/>
      <rect x="405" y="76" width="150" height="158" fill="#4C8DFF" fill-opacity=".55"/>
      <text x="480" y="68" font-size="11" fill="#98A2B3" text-anchor="middle">背景（留边）</text>
      <text x="360" y="284" font-size="12.5" fill="#98A2B3">View=内接矩形 → surface=视频比例 → 完整显示</text>
    </svg>